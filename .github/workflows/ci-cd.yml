name: CI/CD Pipeline

on:
  push:
    branches: [master]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  # Stage 1: Quality Checks
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sticker_api_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sticker_api_test
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sticker_api_test

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sticker_api_test

      - name: Seed test database
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sticker_api_test

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run --reporter=verbose
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sticker_api_test
          REDIS_URL: redis://localhost:6379
          AI_QUOTA_FAIL_CLOSED: 'true'
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci

  # Stage 2: Build Docker Image
  build:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Stage 3: Deploy to VPS
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME,GITHUB_SHA
          script: |
            cd ~/stiker-api
            SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
            IMAGE_REF="${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"
            
            # Pull latest code
            git pull origin master
            
            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull immutable image tag
            docker pull "$IMAGE_REF"
            
            # Start database first (if not running)
            IMAGE_TAG="$SHORT_SHA" docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres redis
            
            # Wait for database to be ready
            sleep 5
            
            # Run database migrations via dedicated service
            IMAGE_TAG="$SHORT_SHA" docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migrate

            # Run idempotent seed data (roles, permissions, default admin bootstrap)
            IMAGE_TAG="$SHORT_SHA" docker compose --env-file .env.production -f docker-compose.prod.yml run --rm seed
            
            # Restart API with new image
            IMAGE_TAG="$SHORT_SHA" docker compose --env-file .env.production -f docker-compose.prod.yml up -d --no-deps api
            
            # Restart nginx
            IMAGE_TAG="$SHORT_SHA" docker compose --env-file .env.production -f docker-compose.prod.yml up -d --no-deps nginx
            
            # Cleanup old images
            docker image prune -f
            
            # Health checks: direct API and reverse proxy
            sleep 10
            curl -fsS http://localhost:3000/health >/dev/null || exit 1
            curl -fsS http://localhost:8080/health >/dev/null || exit 1
