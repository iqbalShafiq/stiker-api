services:
  api:
    image: ghcr.io/iqbalshafiq/stiker-api:${IMAGE_TAG:-latest}
    container_name: api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
    volumes:
      - uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stiker-network
    cpus: '2.0'
    mem_limit: 2g

  migrate:
    image: ghcr.io/iqbalshafiq/stiker-api:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - stiker-network

  seed:
    image: ghcr.io/iqbalshafiq/stiker-api:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
    command: ["npx", "prisma", "db", "seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - stiker-network

  postgres:
    image: postgres:16-alpine
    container_name: stiker-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-sticker_api}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - stiker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sticker_api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: '1.0'
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    container_name: stiker-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - stiker-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    cpus: '0.5'
    mem_limit: 256m

  nginx:
    image: nginx:alpine
    container_name: stiker-nginx
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - uploads:/app/uploads:ro
    depends_on:
      - api
    networks:
      - stiker-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: stiker-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

networks:
  stiker-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads:
